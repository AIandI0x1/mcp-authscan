name: Multi-Registry Daily Scan

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - run: pip install requests
      - run: python3 mcp_multi_registry_scanner.py
      - uses: actions/upload-artifact@v3
        with:
          name: registry-scan-${{ github.run_number }}
          path: multi_registry_scan_results.json
      - name: Commit results
        run: |
          git config user.email "scan@vata.dev"
          git config user.name "VATA Scanner"
          git add multi_registry_scan_results.json
          git commit -m "Daily multi-registry scan - $(date)" || true
          git push
